<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mantovani Barbearia · Votorantim/SP</title>
<meta name="description" content="Mantovani Barbearia em Votorantim/SP. Corte, barba e estilo. Agende pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== CORES (edite aqui) ===== */
:root{--bg:#000;--bg2:#111;--tx:#f5f1e8;--mut:#a8a293;--gold:#f0b82d;--gold2:#ffd566;--line:#262626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.1}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;transition:.3s}
nav.s{background:#000e;backdrop-filter:blur(8px)}
nav img{height:38px;mix-blend-mode:screen}
nav a.l{margin-left:22px;font-size:.9rem;opacity:.85;transition:.2s}nav a.l:hover{color:var(--gold);opacity:1}
/* ===== BOTÕES ANIMADOS ===== */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;overflow:hidden;padding:15px 32px;border:1px solid var(--gold);background:var(--gold);color:#111;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;cursor:pointer;transition:transform .25s,box-shadow .25s,background .3s,color .3s}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px #f0b82d55}
.btn:active{transform:translateY(0) scale(.97)}
.btn.o{background:transparent;color:var(--gold)}
.btn.o:hover{background:var(--gold);color:#111}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-content:center;box-shadow:0 6px 20px #0008;animation:pulse 2s infinite;transition:transform .25s}
.wa:hover{transform:scale(1.12) rotate(-6deg)}
.wa svg{width:30px;height:30px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 #25d36699}70%,100%{box-shadow:0 0 0 18px #25d36600}}
/* ===== HERO ===== */
.hero{position:relative;height:100vh;min-height:600px;overflow:hidden}
.fallback{position:absolute;inset:0;background:radial-gradient(circle at 25% 35%,#3b2c06,transparent 55%),radial-gradient(circle at 80% 75%,#1c1c1c,transparent 50%),#000;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.15) translate(-2%,2%)}}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(#000a,#0007 55%,#000)}
.hero .c{position:relative;z-index:1;height:100%;display:grid;place-content:center;justify-items:center;text-align:center;padding:0 6vw}
.hero .logo{width:min(560px,86vw);mix-blend-mode:screen;animation:up 1s .1s both}
.hero p{max-width:500px;margin:18px auto 30px;color:#ddd6c4;animation:up 1s .4s both}
.hero .btns{animation:up 1s .6s both}
.scroll{position:absolute;bottom:22px;left:50%;width:22px;height:36px;border:2px solid #fff6;border-radius:12px;z-index:1}
.scroll::after{content:"";position:absolute;top:6px;left:50%;width:4px;height:7px;margin-left:-2px;background:var(--gold);border-radius:2px;animation:sc 1.6s infinite}
@keyframes sc{to{transform:translateY(12px);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
/* ===== SEÇÕES ===== */
section{padding:96px 6vw;max-width:1100px;margin:auto}
.t{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:.75rem}
h2{font-size:clamp(2rem,5vw,3.2rem);margin:10px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;perspective:900px}
.card{background:var(--bg2);border:1px solid var(--line);padding:32px 26px;transition:transform .15s ease-out,border-color .3s;transform-style:preserve-3d}
.card:hover{border-color:var(--gold)}
.card h3{font-size:1.4rem;transform:translateZ(30px)}
.card p{color:var(--mut);margin:8px 0 18px;font-size:.95rem;transform:translateZ(15px)}
.card .p{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.6rem;transform:translateZ(40px)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ph{position:relative;aspect-ratio:1;overflow:hidden;background:linear-gradient(160deg,#2a2006,#0c0c0c 70%);border:1px solid var(--line);cursor:zoom-in;display:grid;place-content:center;color:var(--mut);font-size:.85rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.1)}
.ph::after{content:"";position:absolute;inset:0;border:2px solid transparent;transition:.3s}
.ph:hover::after{border-color:var(--gold)}
.lb{position:fixed;inset:0;z-index:50;background:#000e;display:none;place-content:center;cursor:zoom-out}
.lb.on{display:grid}.lb img{max-width:92vw;max-height:88vh}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px}
.box{background:var(--bg2);border:1px solid var(--line);padding:30px}
.box h3{margin-bottom:16px;color:var(--gold)}
.box .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.box .row:last-of-type{border:0}
.box p{color:var(--mut);margin-bottom:20px}
.cta{text-align:center;border-top:1px solid var(--line)}
.cta h2{margin-bottom:24px}
footer{text-align:center;padding:30px 30px 90px;color:var(--mut);font-size:.85rem}
.rv{opacity:0;transform:translateY(34px);transition:1s}.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.hero video{display:none}*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media (max-width:640px){nav a.l{display:none}}
</style>
</head>
<body>

<nav id="nav"><img data-logo alt="Mantovani Barbearia"><div id="menu"></div></nav>

<header class="hero">
  <div class="fallback"></div>
  <video id="vid" autoplay muted loop playsinline preload="metadata"></video>
  <div class="overlay"></div>
  <div class="c">
    <img class="logo" data-logo alt="Mantovani Barbearia">
    <p id="slogan"></p>
    <div class="btns">
      <a class="btn" data-book target="_blank" rel="noopener">Agendar horário</a>
      <a class="btn o" data-map target="_blank" rel="noopener">Como chegar</a>
    </div>
  </div>
  <div class="scroll"></div>
</header>

<section id="servicos"><div class="t rv">Serviços</div><h2 class="rv">O que fazemos de melhor</h2><div class="grid" id="servicos-grid"></div></section>
<section id="trabalhos"><div class="t rv">Galeria</div><h2 class="rv">Nossos trabalhos</h2><div class="gal" id="gal"></div></section>
<section id="local"><div class="t rv">Visite-nos</div><h2 class="rv">Horários e localização</h2>
  <div class="info">
    <div class="box rv"><h3>Horário de atendimento</h3><div id="hours"></div></div>
    <div class="box rv"><h3>Onde estamos</h3><p id="addr"></p><div class="btns" style="justify-content:flex-start"><a class="btn" data-map target="_blank" rel="noopener">Abrir no Google Maps</a><a class="btn o" data-ig target="_blank" rel="noopener">Instagram</a></div></div>
  </div>
</section>
<section class="cta"><div class="t rv">Agendamento</div><h2 class="rv">Pronto para o próximo corte?</h2><a class="btn rv" data-book target="_blank" rel="noopener">Agendar horário</a></section>
<footer id="foot"></footer>

<a class="wa" data-wa target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.79a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41z"/></svg></a>
<div class="lb" id="lb"><img alt=""></div>

<script>
/* =====================================================
   EDITE AQUI: todo o conteúdo do site fica neste bloco
   ===================================================== */
const CONFIG = {
  nome: "Mantovani Barbearia",
  //slogan: "Corte clássico, barba na navalha e atendimento sem pressa, em Votorantim/SP.",
  logo: "logo-mantovani-transparente.png",
  video: { mp4: "hero.mp4", webm: "", poster: "" },   // vídeo do hero (opcional)
  whatsapp: "5515998218758",                                     // DDI + DDD + número, só dígitos
  mensagem: "Olá! Quero agendar um horário.",
  endereco: "R. Júlia Martins Domingues, 1083 - Jardim Clarice, Votorantim - SP, 18116-545",
  mapsUrl: "https://maps.app.goo.gl/2HzoUoUXubykxA6d7",
  instagram: "https://www.instagram.com/mantovanibarbearia/",   
  agendamento: "https://sites.appbarber.com.br/mantovanibarbearia-95w4",                                            // ex.: "https://instagram.com/seuperfil"
  servicos: [
    { nome: "Corte",          desc: "Tesoura ou máquina, com acabamento na navalha.", preco: "R$ 45" },
    { nome: "Barba",          desc: "Toalha quente, um barbear mais suave e sem irritação.",          preco: "R$ 40" },
    { nome: "Corte + Barba",  desc: "O combo completo para sair renovado.",          preco: "R$ 80" },
    { nome: "Sobrancelha",    desc: "Design na navalha, natural e alinhado.",        preco: "R$ 20" },
     { nome: "Epilação Auricular",  desc: "Uma orelha mais limpa sem pelos",          preco: "R$ 20" },
     { nome: "Epilação Nasal",  desc: "Chega de pelos saindo para fora do nariz",          preco: "R$ 20" },
  ],
  horarios: [
    ["Segunda a Sábado", "08h às 20h"],
    ["Domingo", "Fechado"]
  ],
  // Fotos do trabalho: coloque os arquivos na pasta "fotos" e liste aqui.
  // Sem foto no caminho, aparece um espaço reservado.
  galeria: ["fotos/1.png","fotos/2.png","fotos/3.png","fotos/4.png","fotos/5.png","fotos/6.png"]
};

/* ---------- Código (não precisa editar) ---------- */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const C=CONFIG, wa="https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(C.mensagem);
$$("[data-logo]").forEach(i=>i.src=C.logo);
const book=C.agendamento||wa;
$$("[data-wa]").forEach(a=>a.href=wa);
$$("[data-book]").forEach(a=>a.href=book);
$$("[data-map]").forEach(a=>a.href=C.mapsUrl);
$$("[data-ig]").forEach(a=>C.instagram?a.href=C.instagram:a.remove());
$("#slogan").textContent=C.slogan;
$("#addr").textContent=C.endereco;
$("#menu").innerHTML=[["#servicos","Serviços"],["#trabalhos","Trabalhos"],["#local","Local"]].map(m=>`<a class="l" href="${m[0]}">${m[1]}</a>`).join("")+`<a class="btn" style="padding:9px 18px;margin-left:22px" href="${book}" target="_blank" rel="noopener">Agendar</a>`;
$("#servicos-grid").innerHTML=C.servicos.map(s=>`<div class="card rv"><h3>${s.nome}</h3><p>${s.desc}</p><div class="p">${s.preco}</div></div>`).join("");
$("#hours").innerHTML=C.horarios.map(h=>`<div class="row"><span>${h[0]}</span><b>${h[1]}</b></div>`).join("");
$("#gal").innerHTML=C.galeria.map((f,i)=>`<div class="ph rv" data-src="${f}">Foto ${i+1}<img src="${f}" alt="Trabalho ${i+1}" loading="lazy" onerror="this.remove()"></div>`).join("");
$("#foot").textContent="© "+new Date().getFullYear()+" "+C.nome;
// Vídeo do hero
const v=$("#vid");
if(C.video.poster)v.poster=C.video.poster;
const srcs=[[C.video.webm,"video/webm"],[C.video.mp4,"video/mp4"]].filter(x=>x[0]);
v.innerHTML=srcs.map(x=>`<source src="${x[0]}" type="${x[1]}">`).join("");
const last=v.querySelector("source:last-child");
if(last)last.addEventListener("error",()=>v.remove());else v.remove();
// Menu com fundo ao rolar
addEventListener("scroll",()=>$("#nav").classList.toggle("s",scrollY>60));
// Revelar ao rolar
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{threshold:.12});
$$(".rv").forEach(el=>io.observe(el));
// Inclinação 3D nos cartões
$$(".card").forEach(c=>{
  c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`};
  c.onmouseleave=()=>c.style.transform="";
});
// Galeria ampliada
$$(".ph").forEach(p=>p.onclick=()=>{if(!p.querySelector("img"))return;$("#lb img").src=p.dataset.src;$("#lb").classList.add("on")});
$("#lb").onclick=()=>$("#lb").classList.remove("on");
</script>
</body>
</html>
